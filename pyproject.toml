[project]
name = "loss-aware-synthetic-data-generation"
version = "0.1.0"
description = "methodologies for measuring and mitigating the utility loss introduced during synthetic data generation through loss-aware optimization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "ucimlrepo>=0.0.7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data", "src/evaluation"]

[tool.hatch.build]
sources = {"src" = ""}
