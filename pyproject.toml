[project]
name = "loss-aware-synthetic-data-generation"
version = "0.1.0"
description = "methodologies for measuring and mitigating the utility loss introduced during synthetic data generation through loss-aware optimization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "sdv>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: exercises real model training (e.g. CTGAN/TVAE fit); skip with -m 'not slow'",
]

